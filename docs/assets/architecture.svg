<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">ReconTitan architecture</title><desc id="desc">Architecture diagram of browser, Nginx, FastAPI, security middleware, Celery, scanners, MongoDB, Redis and reporting.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050908"/><stop offset="1" stop-color="#0d1812"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5f7868"/></marker></defs>
<rect width="1500" height="700" rx="28" fill="url(#bg)"/><text x="70" y="75" fill="#edf7ef" font-family="Arial" font-size="34" font-weight="700">ReconTitan 0.4.1 Architecture</text><text x="70" y="108" fill="#789080" font-family="monospace" font-size="15">Defense in depth from browser input to bounded outbound scanners</text>
<g font-family="monospace" text-anchor="middle">
  <g transform="translate(60 180)"><rect width="210" height="115" rx="15" fill="#0b1610" stroke="#22d3ee" stroke-opacity=".5"/><text x="105" y="42" fill="#22d3ee" font-size="14">STATIC FRONTEND</text><text x="105" y="70" fill="#e7f2e9" font-size="18" font-weight="700">Dashboard + Report</text><text x="105" y="94" fill="#73877b" font-size="12">sessionStorage API key</text></g>
  <g transform="translate(340 180)"><rect width="210" height="115" rx="15" fill="#0b1610" stroke="#a3e635" stroke-opacity=".5"/><text x="105" y="42" fill="#a3e635" font-size="14">EDGE</text><text x="105" y="70" fill="#e7f2e9" font-size="18" font-weight="700">Nginx + TLS</text><text x="105" y="94" fill="#73877b" font-size="12">limits + static files</text></g>
  <g transform="translate(620 150)"><rect width="260" height="175" rx="15" fill="#0b1610" stroke="#a3e635" stroke-opacity=".7"/><text x="130" y="38" fill="#a3e635" font-size="14">FASTAPI APPLICATION</text><text x="130" y="70" fill="#e7f2e9" font-size="19" font-weight="700">Security Middleware</text><text x="130" y="98" fill="#73877b" font-size="12">rate limits • auth • headers</text><text x="130" y="122" fill="#73877b" font-size="12">injection • framing • body caps</text><text x="130" y="146" fill="#73877b" font-size="12">target normalization • routes</text></g>
  <g transform="translate(950 180)"><rect width="210" height="115" rx="15" fill="#0b1610" stroke="#c084fc" stroke-opacity=".5"/><text x="105" y="42" fill="#c084fc" font-size="14">QUEUE</text><text x="105" y="70" fill="#e7f2e9" font-size="18" font-weight="700">Celery Workers</text><text x="105" y="94" fill="#73877b" font-size="12">phase orchestration</text></g>
  <g transform="translate(1230 180)"><rect width="210" height="115" rx="15" fill="#0b1610" stroke="#fb923c" stroke-opacity=".5"/><text x="105" y="42" fill="#fb923c" font-size="14">SCANNERS</text><text x="105" y="70" fill="#e7f2e9" font-size="18" font-weight="700">Bounded Modules</text><text x="105" y="94" fill="#73877b" font-size="12">DNS • HTTP • JS • ports</text></g>
  <path d="M270 238H330" stroke="#5f7868" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 238H610" stroke="#5f7868" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 238H940" stroke="#5f7868" stroke-width="2" marker-end="url(#arrow)"/><path d="M1160 238H1220" stroke="#5f7868" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(250 440)"><rect width="240" height="115" rx="15" fill="#0b1610" stroke="#ef5350" stroke-opacity=".45"/><text x="120" y="42" fill="#ef5350" font-size="14">OUTBOUND GUARD</text><text x="120" y="70" fill="#e7f2e9" font-size="18" font-weight="700">Safe HTTP Client</text><text x="120" y="94" fill="#73877b" font-size="12">DNS pinning + redirect checks</text></g>
  <g transform="translate(630 440)"><rect width="240" height="115" rx="15" fill="#0b1610" stroke="#60a5fa" stroke-opacity=".45"/><text x="120" y="42" fill="#60a5fa" font-size="14">PERSISTENCE</text><text x="120" y="70" fill="#e7f2e9" font-size="18" font-weight="700">MongoDB</text><text x="120" y="94" fill="#73877b" font-size="12">scan records + findings</text></g>
  <g transform="translate(950 440)"><rect width="240" height="115" rx="15" fill="#0b1610" stroke="#facc15" stroke-opacity=".45"/><text x="120" y="42" fill="#facc15" font-size="14">BROKER</text><text x="120" y="70" fill="#e7f2e9" font-size="18" font-weight="700">Redis</text><text x="120" y="94" fill="#73877b" font-size="12">tasks + results</text></g>
  <g transform="translate(1210 440)"><rect width="240" height="115" rx="15" fill="#0b1610" stroke="#a3e635" stroke-opacity=".45"/><text x="120" y="42" fill="#a3e635" font-size="14">OUTPUT</text><text x="120" y="70" fill="#e7f2e9" font-size="18" font-weight="700">JSON + PDF</text><text x="120" y="94" fill="#73877b" font-size="12">evidence + remediation</text></g>
  <path d="M750 325V425H370V430" fill="none" stroke="#5f7868" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 325V430" stroke="#5f7868" stroke-width="2" marker-end="url(#arrow)"/><path d="M1055 295V430" stroke="#5f7868" stroke-width="2" marker-end="url(#arrow)"/><path d="M1350 295V430" stroke="#5f7868" stroke-width="2" marker-end="url(#arrow)"/>
</g>
<text x="70" y="645" fill="#789080" font-family="monospace" font-size="14">Default posture: public targets only • active intrusive tools disabled • production configuration fails closed</text>
</svg>
