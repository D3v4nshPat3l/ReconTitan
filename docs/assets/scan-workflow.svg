<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-labelledby="title desc">
<title id="title">ReconTitan scan workflow</title><desc id="desc">Six-stage scan workflow from target validation through PDF report.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06100a"/><stop offset="1" stop-color="#0a1710"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#6b8272"/></marker></defs>
<rect width="1500" height="430" rx="26" fill="url(#bg)"/><text x="65" y="68" fill="#edf7ef" font-family="Arial" font-size="32" font-weight="700">From target to actionable report</text>
<g transform="translate(55 135)" font-family="monospace" text-anchor="middle">
<g><circle cx="100" cy="95" r="78" fill="#0d1b13" stroke="#a3e635"/><text x="100" y="62" fill="#a3e635" font-size="14">01</text><text x="100" y="91" fill="#e7f2e9" font-size="16" font-weight="700">VALIDATE</text><text x="100" y="116" fill="#73877b" font-size="11">normalize + resolve</text><text x="100" y="134" fill="#73877b" font-size="11">block private targets</text></g>
