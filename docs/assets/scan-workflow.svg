<path d="M410 95H460" stroke="#6b8272" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(450)"><circle cx="100" cy="95" r="78" fill="#0d1b13" stroke="#60a5fa"/><text x="100" y="62" fill="#60a5fa" font-size="14">03</text><text x="100" y="91" fill="#e7f2e9" font-size="16" font-weight="700">ANALYZE</text><text x="100" y="116" fill="#73877b" font-size="11">headers + TLS + JS</text><text x="100" y="134" fill="#73877b" font-size="11">tech + favicon</text></g>
<path d="M635 95H685" stroke="#6b8272" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(675)"><circle cx="100" cy="95" r="78" fill="#0d1b13" stroke="#fb923c"/><text x="100" y="62" fill="#fb923c" font-size="14">04</text><text x="100" y="91" fill="#e7f2e9" font-size="16" font-weight="700">CORRELATE</text><text x="100" y="116" fill="#73877b" font-size="11">takeover + CVE</text><text x="100" y="134" fill="#73877b" font-size="11">asset relationships</text></g>
<path d="M860 95H910" stroke="#6b8272" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(900)"><circle cx="100" cy="95" r="78" fill="#0d1b13" stroke="#c084fc"/><text x="100" y="62" fill="#c084fc" font-size="14">05</text><text x="100" y="91" fill="#e7f2e9" font-size="16" font-weight="700">PRIORITIZE</text><text x="100" y="116" fill="#73877b" font-size="11">severity + AI</text><text x="100" y="134" fill="#73877b" font-size="11">manual validation</text></g>
<path d="M1085 95H1135" stroke="#6b8272" stroke-width="2" marker-end="url(#a)"/>
<g transform="translate(1125)"><circle cx="100" cy="95" r="78" fill="#0d1b13" stroke="#a3e635"/><text x="100" y="62" fill="#a3e635" font-size="14">06</text><text x="100" y="91" fill="#e7f2e9" font-size="16" font-weight="700">EXPORT</text><text x="100" y="116" fill="#73877b" font-size="11">interactive report</text><text x="100" y="134" fill="#73877b" font-size="11">professional PDF</text></g>
