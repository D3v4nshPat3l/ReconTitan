<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img"
     aria-label="ReconTitan - External attack surface, OSINT and penetration test simulation platform">
  <title>ReconTitan</title>
  <desc>Animated title card in the project palette. Node constellations pulse on either side while a radar
  sweep turns behind the emblem, the tagline types itself out, and four badges rise: evidence-graded,
  48 modules, no binaries required, and 782 tests green.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b07"/>
      <stop offset="55%" stop-color="#08150e"/>
      <stop offset="100%" stop-color="#0a1a10"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="45%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0"/>
      <stop offset="30%" stop-color="#a3e635" stop-opacity=".9"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sweepFill">
      <stop offset="0%" stop-color="#a3e635" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#a3e635" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <clipPath id="dish"><circle cx="600" cy="96" r="58"/></clipPath>
    <clipPath id="typemask"><rect class="type" x="330" y="210" width="0" height="26"/></clipPath>
  </defs>

  <style>
    /* GitHub keeps CSS in an SVG but strips script, so every effect here is
       declarative. Palette and geometry are inherited from the static hero so
       the two read as the same identity. */
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }

    /* The constellation breathes rather than sits: the subject is a surface
       being discovered, and a still diagram says the opposite. */
    .node { animation: pulse 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }

    /* Links draw themselves along their own length. */
    .link { stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 6s ease-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 240 } 35%,88% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0 } }

    .sweep { transform-origin: 600px 96px; animation: spin 5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .ring  { animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity:.18 } 50% { opacity:.40 } }
    .ping  { animation: ping 5s ease-out infinite; }
    @keyframes ping { 0% { r:2; opacity:.9 } 70%,100% { r:54; opacity:0 } }

    .emblem { transform-origin: 600px 96px; animation: tick 5s ease-in-out infinite; }
    @keyframes tick { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(90deg) } }

    /* The tagline types out because it is the sentence the project exists to
       make true, so it earns the extra beat. */
    .type { animation: type 7s steps(46) infinite; }
    @keyframes type { 0% { width:0 } 45%,100% { width:560px } }
    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity:1 } 50.01%,100% { opacity:0 } }

    .rule { animation: wipe 7s ease-out infinite; transform-origin: left center; }
    @keyframes wipe { 0% { transform: scaleX(0) } 30%,100% { transform: scaleX(1) } }

    .badge { opacity:0; animation: rise 7s ease-out infinite; }
    @keyframes rise {
      0%, 52%  { opacity:0; transform: translateY(6px) }
      60%, 95% { opacity:1; transform: translateY(0) }
      100%     { opacity:0; transform: translateY(0) }
    }

    /* Anyone who asked their system to stop moving things gets a still frame.
       The motion is decoration; the content is not. */
    @media (prefers-reduced-motion: reduce) {
      .node,.link,.sweep,.ring,.ping,.emblem,.type,.caret,.rule,.badge {
        animation: none !important; opacity: 1 !important; transform: none !important;
        stroke-dashoffset: 0 !important;
      }
      .ping { opacity: 0 !important; }
      .type { width: 560px !important; }
    }
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="215" cy="90" rx="330" ry="200" fill="url(#glowA)"/>
  <ellipse cx="1010" cy="270" rx="320" ry="190" fill="url(#glowB)"/>

  <!-- node constellation -->
  <g stroke="#a3e635" stroke-opacity=".25" stroke-width="1" fill="none">
    <path class="link" d="M92 250 L168 206 L246 236 L318 190 L392 214"/>
    <path class="link" d="M900 96 L972 128 L1044 92 L1116 124" style="animation-delay:.6s"/>
    <path class="link" d="M168 206 L182 132 L246 236" style="animation-delay:1.2s"/>
  </g>
  <g fill="#a3e635">
    <circle class="node" cx="92"  cy="250" r="2.6"/>
    <circle class="node" cx="168" cy="206" r="3.2" style="animation-delay:.3s"/>
    <circle class="node" cx="246" cy="236" r="2.6" style="animation-delay:.6s"/>
    <circle class="node" cx="318" cy="190" r="3"   style="animation-delay:.9s"/>
    <circle class="node" cx="392" cy="214" r="2.4" style="animation-delay:1.2s"/>
    <circle class="node" cx="182" cy="132" r="2.4" style="animation-delay:1.5s"/>
  </g>
  <g fill="#22d3ee">
    <circle class="node" cx="900"  cy="96"  r="2.6" style="animation-delay:.2s"/>
    <circle class="node" cx="972"  cy="128" r="3.2" style="animation-delay:.7s"/>
    <circle class="node" cx="1044" cy="92"  r="2.6" style="animation-delay:1.1s"/>
    <circle class="node" cx="1116" cy="124" r="2.4" style="animation-delay:1.6s"/>
  </g>

  <!-- radar behind the emblem -->
  <g clip-path="url(#dish)">
    <circle class="ring" cx="600" cy="96" r="56" fill="none" stroke="#a3e635" stroke-width="1"/>
    <circle class="ring" cx="600" cy="96" r="38" fill="none" stroke="#a3e635" stroke-width="1" style="animation-delay:.5s"/>
    <circle class="ring" cx="600" cy="96" r="20" fill="none" stroke="#22d3ee" stroke-width="1" style="animation-delay:1s"/>
    <g class="sweep">
      <path d="M600 96 L600 40 A56 56 0 0 1 640 56 Z" fill="url(#sweepFill)"/>
      <line x1="600" y1="96" x2="600" y2="40" stroke="#a3e635" stroke-width="1.4" stroke-opacity=".8"/>
    </g>
    <circle class="ping" cx="628" cy="70" r="2" fill="none" stroke="#22d3ee" stroke-width="1.3"/>
  </g>

  <!-- emblem -->
  <g class="emblem">
    <g transform="translate(600 96)">
      <g transform="rotate(45)">
        <rect x="-26" y="-26" width="52" height="52" fill="none" stroke="#a3e635" stroke-width="2" rx="4"/>
        <rect x="-11" y="-11" width="22" height="22" fill="#a3e635" rx="2"/>
      </g>
    </g>
  </g>

  <text class="mono" x="600" y="186" text-anchor="middle" font-size="46" font-weight="800"
        fill="url(#title)" letter-spacing="-1">ReconTitan</text>

  <rect class="rule" x="330" y="198" width="540" height="2" fill="url(#rule)"/>

  <g clip-path="url(#typemask)">
    <text class="mono" x="330" y="228" font-size="14" fill="#8fa8a0">Point it at a domain. Get back everything it shows.</text>
  </g>
  <text class="mono caret" x="890" y="228" font-size="14" fill="#a3e635">_</text>

  <g class="badge" style="animation-delay:0s">
    <rect x="258" y="252" width="156" height="26" rx="13" fill="#0d1f12" stroke="#a3e635" stroke-opacity=".45"/>
    <text class="mono" x="336" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#a3e635">EVIDENCE-GRADED</text>
  </g>
  <g class="badge" style="animation-delay:.12s">
    <rect x="424" y="252" width="118" height="26" rx="13" fill="#0b1c22" stroke="#22d3ee" stroke-opacity=".45"/>
    <text class="mono" x="483" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#22d3ee">48 MODULES</text>
  </g>
  <g class="badge" style="animation-delay:.24s">
    <rect x="552" y="252" width="196" height="26" rx="13" fill="#0d1f12" stroke="#a3e635" stroke-opacity=".45"/>
    <text class="mono" x="650" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#a3e635">NO BINARIES REQUIRED</text>
  </g>
  <g class="badge" style="animation-delay:.36s">
    <rect x="758" y="252" width="152" height="26" rx="13" fill="#0b1c22" stroke="#22d3ee" stroke-opacity=".45"/>
    <text class="mono" x="834" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#22d3ee">782 TESTS GREEN</text>
  </g>

  <text class="mono" x="600" y="310" text-anchor="middle" font-size="11" fill="#4a6b58">Every finding carries the evidence that produced it — and says so when a check could not run.</text>
</svg>
