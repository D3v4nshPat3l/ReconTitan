<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img"
     aria-label="Animated terminal replay of a ReconTitan scan: banner, run panel, per-module progress and a severity summary.">
  <title>ReconTitan CLI — animated scan replay</title>
  <desc>A terminal window types out a ReconTitan scan: the ASCII banner, a RUN preflight panel showing the
  target and module count, per-module status rows with timings, and a completion line with severity counts.</desc>

  <style>
    /* GitHub strips script from SVG but keeps CSS, so every effect here is
       declarative. Timings are one shared 19s loop: each line is hidden until
       its own delay, which reads as the terminal typing the scan out live. */
    .win   { fill: #0b0f14; }
    .chrome{ fill: #151b23; }
    .t     { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 13px; }
    .dim   { fill: #6b7a8c; }
    .white { fill: #d7e0ea; }
    .cyan  { fill: #4fd0e0; }
    .green { fill: #7bd88f; }
    .amber { fill: #f2c55c; }
    .blue  { fill: #7aa7f0; }
    .red   { fill: #f2777a; }
    .bold  { font-weight: 700; }

    /* Hidden by default; each .sN below supplies the delay that reveals it.
       One class per step rather than inline styles: every line's entrance is
       a single number to tune, and the whole loop shares one duration. */
    .line { opacity: 0; }
    .s1  { animation: in 19s linear infinite;   animation-delay: 0.0s; }
    .s2  { animation: in 19s linear infinite;   animation-delay: 0.5s; }
    .s3  { animation: in 19s linear infinite;   animation-delay: 1.4s; }
    .s4  { animation: in 19s linear infinite;   animation-delay: 1.7s; }
    .s5  { animation: in 19s linear infinite;   animation-delay: 2.0s; }
    .s6  { animation: in 19s linear infinite;   animation-delay: 2.3s; }
    .s7  { animation: in 19s linear infinite;   animation-delay: 2.6s; }
    .s8  { animation: in 19s linear infinite;   animation-delay: 3.1s; }
    .s9  { animation: in 19s linear infinite;   animation-delay: 3.6s; }
    .s10 { animation: in 19s linear infinite;   animation-delay: 4.6s; }
    .s11 { animation: in 19s linear infinite;   animation-delay: 5.8s; }
    .s12 { animation: in 19s linear infinite;   animation-delay: 7.2s; }
    .s13 { animation: in 19s linear infinite;   animation-delay: 8.1s; }
    .s14 { animation: in 19s linear infinite;   animation-delay: 9.0s; }
    .s15 { animation: in 19s linear infinite;   animation-delay: 9.6s; }
    .s16 { animation: in 19s linear infinite;   animation-delay: 10.2s; }
    .s17 { animation: in 19s linear infinite;   animation-delay: 11.0s; }
    .s18 { animation: in 19s linear infinite;   animation-delay: 11.4s; }
    .s19 { animation: in 19s linear infinite;   animation-delay: 11.8s; }

    @keyframes in {
      0%   { opacity: 0; }
      2%   { opacity: 1; }
      92%  { opacity: 1; }
      97%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .line { opacity: 0; }

    /* The bars grow rather than appear, so the chart reads as a measurement
       being taken rather than a picture that was always there. */
    .bar { transform-origin: left center; animation: grow 19s ease-out infinite; }
    @keyframes grow {
      0%, 60%  { transform: scaleX(0); opacity: 0; }
      68%      { transform: scaleX(1); opacity: 1; }
      92%      { transform: scaleX(1); opacity: 1; }
      97%,100% { transform: scaleX(1); opacity: 0; }
    }
    .cur { animation: blink 1.06s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

    /* Anyone who has asked their OS to stop moving things gets a static
       frame instead of a loop. Motion is decoration here; the content is not. */
    @media (prefers-reduced-motion: reduce) {
      .line, .bar { animation: none !important; opacity: 1 !important; transform: none !important; }
      .cur { animation: none; }
    }
  </style>

  <rect class="win" width="900" height="600" rx="10"/>
  <rect class="chrome" width="900" height="30" rx="10"/>
  <rect class="chrome" y="20" width="900" height="12"/>
  <circle cx="20" cy="15" r="5" fill="#f2777a"/>
  <circle cx="38" cy="15" r="5" fill="#f2c55c"/>
  <circle cx="56" cy="15" r="5" fill="#7bd88f"/>
  <text class="t dim" x="450" y="19.5" text-anchor="middle">recontitan — scan</text>

  <g class="t">
    <text class="line s1 green" x="18" y="56">$ <tspan class="white">python recontitan.py example.com --profile full</tspan></text>

    <g class="cyan">
      <text class="line s2" x="18" y="82" xml:space="preserve">    ____                      _______ __</text>
      <text class="line s2" x="18" y="98" xml:space="preserve">   / __ \___  _________  ____/_  __(_) /_____ _____</text>
      <text class="line s2" x="18" y="114" xml:space="preserve">  / /_/ / _ \/ ___/ __ \/ __ \/ / / / __/ __ `/ __ \</text>
      <text class="line s2" x="18" y="130" xml:space="preserve"> / _, _/  __/ /__/ /_/ / / / / / / / /_/ /_/ / / / /</text>
      <text class="line s2" x="18" y="146" xml:space="preserve">/_/ |_|\___/\___/\____/_/ /_/_/ /_/\__/\__,_/_/ /_/</text>
    </g>
    <text class="line s3 dim" x="18" y="168">  External attack surface assessment   v0.5.0</text>

    <text class="line s4 cyan" x="18" y="196" xml:space="preserve">╭─ RUN ────────────────────────────────────────────────────────────╮</text>
    <text class="line s5" x="18" y="212" xml:space="preserve"><tspan class="cyan">│</tspan><tspan class="dim">  Target        </tspan><tspan class="white bold">example.com</tspan><tspan class="dim">  → 93.184.216.34</tspan></text>
    <text class="line s6" x="18" y="228" xml:space="preserve"><tspan class="cyan">│</tspan><tspan class="dim">  Profile       </tspan><tspan class="white">full</tspan><tspan class="dim">   28 modules</tspan></text>
    <text class="line s7" x="18" y="244" xml:space="preserve"><tspan class="cyan">│</tspan><tspan class="dim">  Danger Mode   </tspan><tspan class="green">locked</tspan></text>
    <text class="line s8 cyan" x="18" y="260" xml:space="preserve">╰──────────────────────────────────────────────────────────────────╯</text>

    <text class="line s9 white bold" x="18" y="292">  SCANNING</text>

    <text class="line s10" x="18" y="316" xml:space="preserve"><tspan class="dim">  [ 1/28] </tspan><tspan class="green">✓</tspan><tspan class="white">  whois                    </tspan><tspan class="dim">  2.1s</tspan><tspan class="green">   3 finding(s)</tspan></text>
    <text class="line s11" x="18" y="336" xml:space="preserve"><tspan class="dim">  [ 2/28] </tspan><tspan class="green">✓</tspan><tspan class="white">  dns_lookup               </tspan><tspan class="dim"> 19.0s</tspan><tspan class="green">   5 finding(s)</tspan></text>
    <text class="line s12" x="18" y="356" xml:space="preserve"><tspan class="dim">  [ 3/28] </tspan><tspan class="red">✗</tspan><tspan class="white">  crt.sh                   </tspan><tspan class="dim">  1.2s</tspan><tspan class="red">   HTTPError: 502</tspan></text>
    <text class="line s13" x="18" y="376" xml:space="preserve"><tspan class="dim">  [ 4/28] </tspan><tspan class="green">✓</tspan><tspan class="white">  subdomain_sources        </tspan><tspan class="dim"> 14.8s</tspan><tspan class="green">   4 finding(s)</tspan></text>
    <text class="line s14" x="18" y="396" xml:space="preserve"><tspan class="dim">  [ 5/28] </tspan><tspan class="dim">○</tspan><tspan class="white">  subfinder                </tspan><tspan class="dim">  0.0s   no findings</tspan></text>

    <text class="line s15 dim" x="18" y="424">  →  applying triage decisions</text>
    <text class="line s16 dim" x="18" y="442">  →  correlating attack paths</text>

    <text class="line s17 dim" x="18" y="470" xml:space="preserve">  ──────────────────────────────────────────────────────────────────</text>
    <text class="line s18" x="18" y="492" xml:space="preserve"><tspan class="green bold">  ✓ scan complete</tspan><tspan class="dim">   94.2s   34 findings</tspan></text>

    <g class="line s19">
      <text class="red"   x="30" y="524">critical 0</text>
      <text class="amber" x="130" y="524">high 2</text>
      <text class="amber" x="210" y="524">medium 7</text>
      <text class="blue"  x="305" y="524">low 9</text>
      <text class="dim"   x="375" y="524">info 16</text>
    </g>

    <g>
      <rect class="bar" x="30"  y="540" width="46"  height="8" rx="2" fill="#f2c55c" style="animation-delay:.1s"/>
      <rect class="bar" x="84"  y="540" width="160" height="8" rx="2" fill="#f2c55c" style="animation-delay:.2s"/>
      <rect class="bar" x="252" y="540" width="206" height="8" rx="2" fill="#7aa7f0" style="animation-delay:.3s"/>
      <rect class="bar" x="466" y="540" width="366" height="8" rx="2" fill="#39485c" style="animation-delay:.4s"/>
    </g>

    <text class="t green cur" x="18" y="578">$ <tspan class="white">█</tspan></text>
  </g>
</svg>
