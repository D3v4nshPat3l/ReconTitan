# ReconTitan production stack. Populate .env before starting.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: recontitan-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend:/var/www/frontend:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/log/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    container_name: recontitan-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  mongo:
    image: mongo:7.0
    container_name: recontitan-mongo
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init/01-create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?Set MONGO_ROOT_PASS in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-recontitan}
      MONGO_APP_USER: ${MONGO_USER:?Set MONGO_USER in .env}
      MONGO_APP_PASS: ${MONGO_PASS:?Set MONGO_PASS in .env}
      MONGO_APP_DB: ${MONGO_DB:-recontitan}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -qx 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Mongo is the only service on both networks, so admin can read the audit
    # trail without the scanner containers gaining any route to admin.
    networks:
      - default
      - adminnet

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recontitan-api
    expose:
      - "8000"
    volumes:
      - ./frontend:/frontend:ro
    environment:
      ASYNC_SCANS_ENABLED: "true"
      RECONTITAN_DEBUG: "false"
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      API_ACCESS_KEY: ${API_ACCESS_KEY:?Set API_ACCESS_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-2097152}
      ENABLE_ACTIVE_VULN_TOOLS: ${ENABLE_ACTIVE_VULN_TOOLS:-false}
      RATE_LIMIT_SCAN: ${RATE_LIMIT_SCAN:-5}
      RATE_LIMIT_DANGER: ${RATE_LIMIT_DANGER:-2}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_USER:?Set MONGO_USER in .env}
      MONGO_PASS: ${MONGO_PASS:?Set MONGO_PASS in .env}
      MONGO_DB: ${MONGO_DB:-recontitan}
      TMPDIR: /tmp/recontitan
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-recontitan}
      SCAN_TIMEOUT_NMAP: ${SCAN_TIMEOUT_NMAP:-300}
      SCAN_TIMEOUT_NUCLEI: ${SCAN_TIMEOUT_NUCLEI:-600}
      SCAN_TIMEOUT_DEFAULT: ${SCAN_TIMEOUT_DEFAULT:-120}
      JS_ANALYSIS_MAX_FILES: ${JS_ANALYSIS_MAX_FILES:-20}
      JS_ANALYSIS_MAX_BYTES: ${JS_ANALYSIS_MAX_BYTES:-1048576}
      TAKEOVER_MAX_SUBDOMAINS: ${TAKEOVER_MAX_SUBDOMAINS:-150}
      # Project default is enabled; every Danger scan still requires acknowledgement.
      ALLOW_DANGER_MODE: ${ALLOW_DANGER_MODE:-true}
      DANGER_MODE_MAX_TARGETS: ${DANGER_MODE_MAX_TARGETS:-1}
      DANGER_MAX_HOSTS: ${DANGER_MAX_HOSTS:-5}
      DANGER_MAX_REQUESTS_TOTAL: ${DANGER_MAX_REQUESTS_TOTAL:-900}
      DANGER_MAX_REQUESTS_PER_MODULE: ${DANGER_MAX_REQUESTS_PER_MODULE:-120}
      DANGER_MAX_PAYLOADS_PER_SCAN: ${DANGER_MAX_PAYLOADS_PER_SCAN:-600}
      DANGER_MAX_ENDPOINTS: ${DANGER_MAX_ENDPOINTS:-25}
      DANGER_MAX_CRAWL_PAGES: ${DANGER_MAX_CRAWL_PAGES:-12}
      DANGER_REQUEST_DELAY_MS: ${DANGER_REQUEST_DELAY_MS:-250}
      DANGER_REQUEST_TIMEOUT: ${DANGER_REQUEST_TIMEOUT:-12}
      # Wall-clock ceiling for the danger phase. Documented in .env.example but
      # previously never passed through, so it was stuck at the code default.
      DANGER_MAX_SCAN_SECONDS: ${DANGER_MAX_SCAN_SECONDS:-240}
      SCAN_TOOL_CONCURRENCY: ${SCAN_TOOL_CONCURRENCY:-8}
      SCAN_SOFT_TIME_LIMIT: ${SCAN_SOFT_TIME_LIMIT:-}
      HTTP_POOL_MAX_IDLE: ${HTTP_POOL_MAX_IDLE:-16}
      DNS_CACHE_TTL_SECONDS: ${DNS_CACHE_TTL_SECONDS:-30}
      DANGER_TIME_DELAY_SECONDS: ${DANGER_TIME_DELAY_SECONDS:-2}
      DANGER_SUBDOMAIN_BRUTE_LIMIT: ${DANGER_SUBDOMAIN_BRUTE_LIMIT:-100}
      DANGER_DIR_BUST_WORDLIST: ${DANGER_DIR_BUST_WORDLIST:-120}
      DANGER_IDOR_MAX_IDS: ${DANGER_IDOR_MAX_IDS:-10}
      DANGER_ENABLE_XXE_OOB: ${DANGER_ENABLE_XXE_OOB:-false}
      # AI narration. Default points at Ollama on the Docker host, which is
      # where a developer's existing `ollama serve` already listens. Point it
      # at http://ollama:11434 to use the bundled service instead.
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      AI_MAX_FINDING_EXPLANATIONS: ${AI_MAX_FINDING_EXPLANATIONS:-8}
      AI_EXPLANATION_BUDGET_SECONDS: ${AI_EXPLANATION_BUDGET_SECONDS:-90}
      AI_EXPLANATION_CONCURRENCY: ${AI_EXPLANATION_CONCURRENCY:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMAIL_ALERTS_ENABLED: ${EMAIL_ALERTS_ENABLED:-false}
      ALERT_MIN_SEVERITY: ${ALERT_MIN_SEVERITY:-high}
      ALERT_EMAIL_RECIPIENTS: ${ALERT_EMAIL_RECIPIENTS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CENSYS_API_ID: ${CENSYS_API_ID:-}
      CENSYS_API_SECRET: ${CENSYS_API_SECRET:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      INTELX_API_KEY: ${INTELX_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_MAX_PRODUCTS: ${NVD_MAX_PRODUCTS:-5}
    # Docker Desktop resolves host.docker.internal on its own; Linux does not,
    # so declare it here or OLLAMA_BASE_URL cannot reach an Ollama running on
    # the host. Harmless where the name already exists.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp/recontitan:uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recontitan-worker
    environment:
      RECONTITAN_DEBUG: "false"
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      ENABLE_ACTIVE_VULN_TOOLS: ${ENABLE_ACTIVE_VULN_TOOLS:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_USER:?Set MONGO_USER in .env}
      MONGO_PASS: ${MONGO_PASS:?Set MONGO_PASS in .env}
      MONGO_DB: ${MONGO_DB:-recontitan}
      TMPDIR: /tmp/recontitan
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-recontitan}
      SCAN_TIMEOUT_NMAP: ${SCAN_TIMEOUT_NMAP:-300}
      SCAN_TIMEOUT_NUCLEI: ${SCAN_TIMEOUT_NUCLEI:-600}
      SCAN_TIMEOUT_DEFAULT: ${SCAN_TIMEOUT_DEFAULT:-120}
      JS_ANALYSIS_MAX_FILES: ${JS_ANALYSIS_MAX_FILES:-20}
      JS_ANALYSIS_MAX_BYTES: ${JS_ANALYSIS_MAX_BYTES:-1048576}
      TAKEOVER_MAX_SUBDOMAINS: ${TAKEOVER_MAX_SUBDOMAINS:-150}
      # Project default is enabled; every Danger scan still requires acknowledgement.
      ALLOW_DANGER_MODE: ${ALLOW_DANGER_MODE:-true}
      DANGER_MODE_MAX_TARGETS: ${DANGER_MODE_MAX_TARGETS:-1}
      DANGER_MAX_HOSTS: ${DANGER_MAX_HOSTS:-5}
      DANGER_MAX_REQUESTS_TOTAL: ${DANGER_MAX_REQUESTS_TOTAL:-900}
      DANGER_MAX_REQUESTS_PER_MODULE: ${DANGER_MAX_REQUESTS_PER_MODULE:-120}
      DANGER_MAX_PAYLOADS_PER_SCAN: ${DANGER_MAX_PAYLOADS_PER_SCAN:-600}
      DANGER_MAX_ENDPOINTS: ${DANGER_MAX_ENDPOINTS:-25}
      DANGER_MAX_CRAWL_PAGES: ${DANGER_MAX_CRAWL_PAGES:-12}
      DANGER_REQUEST_DELAY_MS: ${DANGER_REQUEST_DELAY_MS:-250}
      DANGER_REQUEST_TIMEOUT: ${DANGER_REQUEST_TIMEOUT:-12}
      # Wall-clock ceiling for the danger phase. Documented in .env.example but
      # previously never passed through, so it was stuck at the code default.
      DANGER_MAX_SCAN_SECONDS: ${DANGER_MAX_SCAN_SECONDS:-240}
      SCAN_TOOL_CONCURRENCY: ${SCAN_TOOL_CONCURRENCY:-8}
      SCAN_SOFT_TIME_LIMIT: ${SCAN_SOFT_TIME_LIMIT:-}
      HTTP_POOL_MAX_IDLE: ${HTTP_POOL_MAX_IDLE:-16}
      DNS_CACHE_TTL_SECONDS: ${DNS_CACHE_TTL_SECONDS:-30}
      DANGER_TIME_DELAY_SECONDS: ${DANGER_TIME_DELAY_SECONDS:-2}
      DANGER_SUBDOMAIN_BRUTE_LIMIT: ${DANGER_SUBDOMAIN_BRUTE_LIMIT:-100}
      DANGER_DIR_BUST_WORDLIST: ${DANGER_DIR_BUST_WORDLIST:-120}
      DANGER_IDOR_MAX_IDS: ${DANGER_IDOR_MAX_IDS:-10}
      DANGER_ENABLE_XXE_OOB: ${DANGER_ENABLE_XXE_OOB:-false}
      # AI narration. Default points at Ollama on the Docker host, which is
      # where a developer's existing `ollama serve` already listens. Point it
      # at http://ollama:11434 to use the bundled service instead.
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      AI_MAX_FINDING_EXPLANATIONS: ${AI_MAX_FINDING_EXPLANATIONS:-8}
      AI_EXPLANATION_BUDGET_SECONDS: ${AI_EXPLANATION_BUDGET_SECONDS:-90}
      AI_EXPLANATION_CONCURRENCY: ${AI_EXPLANATION_CONCURRENCY:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMAIL_ALERTS_ENABLED: ${EMAIL_ALERTS_ENABLED:-false}
      ALERT_MIN_SEVERITY: ${ALERT_MIN_SEVERITY:-high}
      ALERT_EMAIL_RECIPIENTS: ${ALERT_EMAIL_RECIPIENTS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CENSYS_API_ID: ${CENSYS_API_ID:-}
      CENSYS_API_SECRET: ${CENSYS_API_SECRET:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      INTELX_API_KEY: ${INTELX_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_MAX_PRODUCTS: ${NVD_MAX_PRODUCTS:-5}
    # Docker Desktop resolves host.docker.internal on its own; Linux does not,
    # so declare it here or OLLAMA_BASE_URL cannot reach an Ollama running on
    # the host. Harmless where the name already exists.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: >
      celery -A app.celery_app:celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=default,orchestrator,recon,osint,vulnscan,danger
      --hostname=worker@%h
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp/recontitan:uid=10001,gid=10001,mode=0700
      - /tmp/sqlmap_rt:uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recontitan-admin
    # Host loopback ONLY. Docker publishes this on 127.0.0.1, so the port is
    # unreachable from the network regardless of cloud firewall rules. Reaching
    # it requires an SSH tunnel:
    #   ssh -N -L 9000:127.0.0.1:9000 root@your-server
    ports:
      - "127.0.0.1:${ADMIN_PORT:-9000}:9000"
    environment:
      RECONTITAN_DEBUG: "false"
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      ADMIN_PORT: "9000"
      ADMIN_MAX_FAILURES: ${ADMIN_MAX_FAILURES:-5}
      ADMIN_LOCKOUT_SECONDS: ${ADMIN_LOCKOUT_SECONDS:-900}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_USER:?Set MONGO_USER in .env}
      MONGO_PASS: ${MONGO_PASS:?Set MONGO_PASS in .env}
      MONGO_DB: ${MONGO_DB:-recontitan}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-recontitan}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      TMPDIR: /tmp/recontitan
    command: >
      uvicorn app.admin.main:admin_app
      --host 0.0.0.0
      --port 9000
      --no-server-header
    depends_on:
      mongo:
        condition: service_healthy
    # Deliberately NOT on the default network: the api and worker containers
    # forge HTTP requests to user-supplied targets, so they must have no route
    # to this service even if target validation is bypassed.
    networks:
      - adminnet
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp/recontitan:uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  redis_data:
  mongo_data:

networks:
  # The scanner containers are never attached to this. Isolation here is
  # structural: there is no route from the request-forging services to admin.
  adminnet:
    driver: bridge
