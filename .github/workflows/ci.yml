name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Compile and test
        env:
          PYTHONPATH: backend
          RECONTITAN_DEBUG: "true"
        run: |
          python -m compileall -q backend/app
          pytest -q backend/tests
      - name: Frontend and deployment syntax
        run: |
          node --check frontend/dashboard.js
          node --check frontend/report.js
          node --check frontend/findings-explorer.js
          node --check frontend/scan-progress.js
          node --test frontend/tests/*.test.cjs
          bash -n deploy.sh
          bash -n setup.sh
          bash -n uninstall.sh
      - name: Deployment preflight
        # Gates on configuration that fails silently rather than loudly: a
        # database that is not there, limits that stop being shared, an admin
        # surface with no network control. Simulated as a serverless deploy
        # because that is the shape with the most ways to be quietly wrong.
        env:
          PYTHONPATH: backend
          RECONTITAN_SKIP_DOTENV: "1"
          VERCEL: "1"
          RECONTITAN_DEBUG: "false"
          SECRET_KEY: ci-only-secret-value-that-is-over-thirty-two-chars
          API_ACCESS_KEY: ci-api-access-key-value-over-thirty-two-characters
          DOMAIN: scanner.example.com
          CORS_ORIGINS: https://scanner.example.com
          MONGO_URI: mongodb+srv://ci:ci@example.abcd.mongodb.net/recontitan
          REDIS_URL: rediss://default:ci@example.upstash.io:6379
        run: python -m app.preflight

      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt
      - name: Static security scan
        run: bandit -q -ll -r backend/app -x backend/tests
      - name: Validate Compose configuration
        env:
          DOMAIN: scanner.example.com
          SECRET_KEY: ci-only-secret-value-that-is-over-thirty-two-chars
          CORS_ORIGINS: https://scanner.example.com
          API_ACCESS_KEY: ci-api-access-key-value-over-thirty-two-characters
          REDIS_PASSWORD: ci-redis-password
          MONGO_ROOT_USER: recontitan_root
          MONGO_ROOT_PASS: ci-root-mongo-password
          MONGO_USER: recontitan_app
          MONGO_PASS: ci-mongo-password
          MONGO_AUTH_SOURCE: recontitan
          ADMIN_TOKEN: ci-admin-console-token-value-over-forty-characters-long
        run: |
          docker compose config --quiet
          trap 'docker compose down' EXIT
          docker compose up -d --wait --wait-timeout 120 redis mongo

  setup-regressions:
    name: Setup regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies in runner environment
        run: python -m pip install -r backend/requirements.txt pytest==8.4.2
      - name: Exercise setup logic without installing tools or starting services
        run: python -m pytest -q backend/tests/test_setup_scripts.py
